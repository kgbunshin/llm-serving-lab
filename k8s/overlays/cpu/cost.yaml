# Node cost per hour, used by the dashboard. On the VPS the cost is fixed (monthly
# plan divided by 730 h). Adjust to the actual amount on your bill.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-node-cost
  namespace: monitoring
spec:
  groups:
    - name: llm-cost-input
      rules:
        - record: llm:node_cost_usd_per_hour
          expr: vector(0.0137)   # ~US$10/month ÷ 730 h. TODO: actual Hostinger plan price
          labels:
            profile: cpu
