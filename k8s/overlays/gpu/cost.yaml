# Hourly cost of the nodes running during the test (GKE spot).
# Check prices at https://cloud.google.com/compute/gpus-pricing before running.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-node-cost
  namespace: monitoring
spec:
  groups:
    - name: llm-cost-input
      rules:
        - record: llm:node_cost_usd_per_hour
          # g2-standard-4 spot (L4) + e2-standard-4 spot (system). TODO: actual price for the region
          expr: vector(0.30 + 0.05)
          labels:
            profile: gpu
