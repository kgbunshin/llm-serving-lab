# Step 3: mTLS STRICT in the namespace. Nothing talks to the model in plaintext.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: llm
spec:
  mtls:
    mode: STRICT
---
# Only the ingress gateway calls the model. Metrics are read from the sidecar's
# port 15020 (metrics merging), which doesn't go through this policy.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: only-ingress
  namespace: llm
spec:
  selector:
    matchLabels:
      app: llm
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-ingress/sa/istio-ingressgateway
