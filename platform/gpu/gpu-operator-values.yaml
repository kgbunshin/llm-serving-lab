# Step 1 (GPU profile): the operator installs the driver, container toolkit,
# device plugin and DCGM exporter. On GKE the node pool is created with
# gpu-driver-version=disabled and an Ubuntu image, so the operator owns the driver.
driver:
  enabled: true
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
node-feature-discovery:
  worker:
    tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
