# O GKE só deixa pods com essas PriorityClasses fora do kube-system se houver
# uma ResourceQuota liberando. O GPU operator usa as duas.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-operator-quota
  namespace: gpu-operator
spec:
  hard:
    pods: "100"
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values: [system-node-critical, system-cluster-critical]
