# Lean kube-prometheus-stack for a single node.
alertmanager:
  enabled: false
# k3s/GKE don't expose these components; leaving them on only creates "down" targets.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
prometheus:
  prometheusSpec:
    # 30 days on real disk (k3s local-path): the probe runs 24h and the
    # history survives pod restarts.
    retention: 30d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    scrapeInterval: 15s
    # Picks up PodMonitors/Rules from any namespace, not just the chart's.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
grafana:
  adminPassword: ""        # the chart generates a random password in a Secret
  service:
    type: ClusterIP
  sidecar:
    # The sidecars ask Grafana to "reload" using user/password, which are
    # disabled when Access SSO is on (returns 401). Without reload, Grafana
    # rereads dashboards from disk on its own. (The datasources sidecar still
    # tries to reload and logs 401; harmless, the datasource is static.)
    dashboards:
      enabled: true
      searchNamespace: ALL
      skipReload: true
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 768Mi}   # 384Mi got OOMKilled on Grafana 13
  grafana.ini:
    plugins:
      # By default Grafana downloads ~15 plugins at startup (pyroscope, loki,
      # mssql...). We don't use them, and it blew the memory limit.
      preinstall_disabled: true
