# kube-prometheus-stack enxuto para um nó só.
alertmanager:
  enabled: false
# k3s/GKE não expõem esses componentes; deixá-los ligados só gera alvos "down".
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
prometheus:
  prometheusSpec:
    # 30 dias em disco de verdade (local-path do k3s): o probe roda 24h e o
    # histórico sobrevive a restart do pod.
    retention: 30d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    scrapeInterval: 15s
    # Pega PodMonitors/Rules de qualquer namespace, não só os do chart.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}
grafana:
  adminPassword: ""        # o chart gera uma senha aleatória num Secret
  service:
    type: ClusterIP
  sidecar:
    # Os sidecars pedem "reload" ao Grafana com usuário/senha, que ficam
    # desligados quando o SSO do Access está ativo (dá 401). Sem reload, o
    # Grafana relê os dashboards do disco sozinho. (O sidecar de datasources
    # ainda tenta o reload e loga 401; é inofensivo, o datasource é fixo.)
    dashboards:
      enabled: true
      searchNamespace: ALL
      skipReload: true
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 768Mi}   # 384Mi dava OOMKilled no Grafana 13
  grafana.ini:
    plugins:
      # Por padrão o Grafana baixa ~15 plugins na subida (pyroscope, loki,
      # mssql...). Não usamos, e isso estourava a memória.
      preinstall_disabled: true
