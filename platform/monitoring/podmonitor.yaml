# Scrapes port 15020 on every pod with an Istio sidecar (and on the gateway).
# With metrics merging, it returns Envoy metrics (istio_*) and app metrics
# (vllm:* or llamacpp:*) together, without opening an exception in mTLS STRICT.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-merged
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [llm, istio-ingress]
  selector:
    matchExpressions:
      - {key: service.istio.io/canonical-name, operator: Exists}
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: $1:15020
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [istio-system]
  selector:
    matchLabels:
      app: istiod
  endpoints:
    - port: http-monitoring
