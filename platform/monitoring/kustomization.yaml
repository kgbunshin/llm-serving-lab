apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - podmonitor.yaml
  - rules.yaml
configMapGenerator:
  - name: llm-dashboard
    files: [dashboard.json]
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"   # o sidecar do Grafana importa sozinho
  - name: slo-sentinel-dashboard
    files: [sentinel-dashboard.json]
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"   # gerado por `sentinel dashboard` (repo slo-sentinel)
