apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - podmonitor.yaml
  - rules.yaml
configMapGenerator:
  - name: llm-dashboard
    files: [dashboard.json]
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"   # the Grafana sidecar imports it automatically
