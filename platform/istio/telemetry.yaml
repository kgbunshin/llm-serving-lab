# Adds the request path as a label on gateway metrics, to measure per-route
# latency. Cardinality stays bounded because the gateway is not public and the
# VirtualService has only 4 routes.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: route-label
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  metrics:
    - providers: [{name: prometheus}]
      overrides:
        - match: {metric: REQUEST_COUNT, mode: CLIENT}
          tagOverrides:
            request_path: {value: request.url_path}
        - match: {metric: REQUEST_DURATION, mode: CLIENT}
          tagOverrides:
            request_path: {value: request.url_path}
