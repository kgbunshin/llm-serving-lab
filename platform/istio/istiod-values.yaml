# Lean install: only what the project uses.
autoscaleEnabled: false
resources:
  requests: {cpu: 100m, memory: 256Mi}
meshConfig:
  enablePrometheusMerge: true   # app + Envoy metrics on port 15020
global:
  proxy:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: "1", memory: 256Mi}
